name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Keystore
        run: |
          mkdir -p ci
          if [ -f ci/keystore.b64 ]; then
            base64 -d ci/keystore.b64 > ci/keystore.p12
          else
            keytool -genkeypair -keystore ci/keystore.p12 -storetype PKCS12 -alias temizle \
              -keyalg RSA -keysize 2048 -validity 36500 -storepass android -keypass android \
              -dname "CN=Temizle, O=Temp"
          fi

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Inspect APK
        if: steps.build.outcome == 'success'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -l "$APK" > apk-info.txt
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump badging "$APK" 2>&1 | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|application-label:)" >> apk-info.txt || true
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" 2>&1 | head -5 >> apk-info.txt || true

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: temizle-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        if: steps.build.outcome == 'success' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Temizle build ${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk

      - name: Push log branch
        if: always()
        env:
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p /tmp/lg
          cd /tmp/lg
          git init -q -b build-log
          { echo "outcome=$OUTCOME"; echo "sha=$GITHUB_SHA"; echo "run=$GITHUB_RUN_NUMBER"; } > status.txt
          grep -E "^e: |error:|FAILED|What went wrong|Execution failed|BUILD " "$GITHUB_WORKSPACE/build.log" 2>/dev/null | head -150 > errors.txt || true
          tail -n 120 "$GITHUB_WORKSPACE/build.log" > tail.txt 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/apk-info.txt" . 2>/dev/null || true
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "log $GITHUB_RUN_NUMBER"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-log

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
